<script>
function initializePublicationTabs() {
  var tabs = document.querySelectorAll('.publication-tab');
  var panels = document.querySelectorAll('.publication-panel');

  if (!tabs.length || !panels.length) {
    return;
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var targetId = 'tab-' + tab.getAttribute('data-tab');
      var targetPanel = document.getElementById(targetId);

      if (!targetPanel || tab.classList.contains('active')) {
        return;
      }

      tabs.forEach(function(t) {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });

      panels.forEach(function(panel) {
        panel.classList.remove('active');
      });

      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      targetPanel.classList.add('active');
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  initializePublicationTabs();
});
</script>
