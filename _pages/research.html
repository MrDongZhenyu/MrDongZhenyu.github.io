<script>
function initializePublicationTabs() {
  var tabs = document.querySelectorAll('.publication-tab');
  var panels = document.querySelectorAll('.publication-panel');

  if (!tabs.length || !panels.length) {
    return;
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var targetId = 'tab-' + tab.getAttribute('data-tab');
      var targetPanel = document.getElementById(targetId);

      if (!targetPanel || tab.classList.contains('active')) {
        return;
      }

      tabs.forEach(function(t) {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });

      panels.forEach(function(panel) {
        panel.classList.remove('active');
      });

      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      targetPanel.classList.add('active');
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  initializePublicationTabs();
});
</script>

<script>
function initializeRIGallery() {
  const gallery = document.querySelector('.ri-gallery');

  if (!gallery) return;

  const slides = gallery.querySelectorAll('.ri-gallery-slide');
  const prevButton = gallery.querySelector('.ri-gallery-prev');
  const nextButton = gallery.querySelector('.ri-gallery-next');

  let currentSlide = 0;

  function showSlide(index) {
    if (index < 0) {
      index = slides.length - 1;
    }

    if (index >= slides.length) {
      index = 0;
    }

    slides.forEach(function(slide) {
      slide.classList.remove('active');
    });

    slides[index].classList.add('active');
    currentSlide = index;
  }

  prevButton.addEventListener('click', function() {
    showSlide(currentSlide - 1);
  });

  nextButton.addEventListener('click', function() {
    showSlide(currentSlide + 1);
  });

  showSlide(0);
}

document.addEventListener('DOMContentLoaded', function() {
  initializePublicationTabs();
  initializeRIGallery();
});
</script>
